<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EvangelCake · Contenido Mayo 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --paper:#f5f0e8;
    --pink:#f4b8d0;
    --pink-deep:#e85a9a;
    --gold:#c79a4a;
    --cream:#fbf3df;
    --ink:#1a1614;
    --ink-2:#3a322c;

    --serif:'Fraunces', Georgia, serif;
    --sans:'Inter', system-ui, sans-serif;
    --mono:'JetBrains Mono', monospace;
    --script:'Great Vibes', cursive;

    --shadow:0 12px 40px rgba(26,22,20,.18);
    --shadow-sm:0 4px 18px rgba(26,22,20,.10);
    --radius:14px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}

  /* ---------- DASHBOARD CHROME ---------- */
  .dashboard-header{
    padding:32px 40px 24px;
    border-bottom:1px solid rgba(26,22,20,.08);
    background:linear-gradient(180deg,var(--cream) 0%,var(--paper) 100%);
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:32px;
    align-items:center;
  }
  .brand-mark{display:flex;align-items:center;gap:14px}
  .brand-mark img{height:64px;width:auto}
  .brand-mark .titles{line-height:1.1}
  .brand-mark .titles h1{
    font-family:var(--serif);
    font-weight:500;
    font-size:26px;
    margin:0;
    letter-spacing:-.02em;
  }
  .brand-mark .titles p{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-2);
    margin:4px 0 0;
    text-transform:uppercase;
    letter-spacing:.18em;
  }

  .header-tagline{
    font-family:var(--script);
    font-size:32px;
    color:var(--pink-deep);
    text-align:center;
    line-height:1;
  }

  .stats{display:flex;gap:18px}
  .stat{
    background:#fff;
    border:1px solid rgba(26,22,20,.08);
    padding:12px 18px;
    border-radius:12px;
    min-width:90px;
    text-align:center;
    box-shadow:var(--shadow-sm);
  }
  .stat span{
    display:block;
    font-family:var(--mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.15em;
    color:var(--ink-2);
  }
  .stat strong{
    display:block;
    font-family:var(--serif);
    font-size:28px;
    font-weight:500;
    margin-top:4px;
    color:var(--ink);
  }

  /* ---------- MAIN LAYOUT ---------- */
  .dashboard-main{
    padding:40px;
    padding-right:calc(40px + var(--editor-w, 0px));
    transition:padding .35s ease;
  }
  body.editor-open{ --editor-w: 420px; }

  /* ---------- SECTION TABS ---------- */
  .section-tabs{
    position:sticky;top:0;z-index:50;
    background:rgba(245,240,232,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(26,22,20,.08);
    padding:14px 40px;
    padding-right:calc(40px + var(--editor-w, 0px));
    transition:padding .35s ease;
    display:flex;
    gap:10px;
    overflow-x:auto;
    flex-wrap:wrap;
  }
  .section-tabs button{
    background:#fff;
    border:1px solid rgba(26,22,20,.12);
    padding:8px 16px;
    border-radius:99px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
    transition:all .2s ease;
  }
  .section-tabs button:hover{ border-color:var(--pink-deep); color:var(--pink-deep); }
  .section-tabs button.active{
    background:var(--ink);color:var(--cream);border-color:var(--ink);
  }
  .section-tabs button .count{
    margin-left:8px;
    font-family:var(--serif);
    font-weight:600;
    font-size:13px;
    letter-spacing:0;
    text-transform:none;
    color:var(--pink-deep);
  }
  .section-tabs button.active .count{ color:var(--pink); }

  /* extra stories-row variants for non-cadena sections */
  .stories-row.flex5{ grid-template-columns:repeat(5,1fr); }
  .stories-row.flex4{ grid-template-columns:repeat(4,1fr); }
  .stories-row.flex2{ grid-template-columns:repeat(3,1fr); }
  .stories-row.flex2 .piece-card{ max-width:none; }
  .stories-row.flex2 > *:nth-child(n+3){ display:none; }
  @media (max-width:1100px){
    .stories-row.flex5, .stories-row.flex4{ grid-template-columns:repeat(3,1fr); }
  }
  @media (max-width:760px){
    .stories-row.flex5, .stories-row.flex4{ grid-template-columns:repeat(2,1fr); }
  }

  .section-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin:36px 0 18px;
    padding-bottom:14px;
    border-bottom:2px solid var(--ink);
  }
  .section-header h2{
    font-family:var(--serif);
    font-size:36px;
    font-weight:500;
    margin:0;
    letter-spacing:-.02em;
  }
  .section-header h2 em{
    font-family:var(--script);
    color:var(--pink-deep);
    font-style:normal;
    font-size:.85em;
    margin-right:8px;
  }
  .section-header .meta{
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.18em;
    color:var(--ink-2);
  }

  /* ---------- STORIES GRID ---------- */
  .cadena{margin-bottom:34px}
  .cadena-label{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:14px;
  }
  .cadena-label .num{
    font-family:var(--serif);
    font-weight:600;
    font-size:48px;
    color:var(--pink-deep);
    line-height:1;
  }
  .cadena-label .info{line-height:1.2}
  .cadena-label .info strong{
    font-family:var(--serif);
    font-size:18px;
    font-weight:500;
    display:block;
  }
  .cadena-label .info span{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-2);
    text-transform:uppercase;
    letter-spacing:.15em;
  }

  .stories-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
  }

  /* ---------- CARRUSEL GRID ---------- */
  .carrusel-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:18px;
  }

  /* ---------- PIECE CARD ---------- */
  .piece-card{
    background:#fff;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease;
    position:relative;
    border:2px solid transparent;
  }
  .piece-card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow);
  }
  .piece-card.active{
    border-color:var(--pink-deep);
    box-shadow:0 0 0 4px rgba(232,90,154,.18), var(--shadow);
  }
  .piece-card .thumb-wrap{
    position:relative;
    width:100%;
    background:#000;
    overflow:hidden;
  }
  .piece-card.story .thumb-wrap{ aspect-ratio:9/16; }
  .piece-card.carrusel .thumb-wrap{ aspect-ratio:1/1; }

  .piece-card .thumb-scale{
    position:absolute;
    top:0;left:0;
    width:1080px;
    transform-origin:top left;
    pointer-events:none;
  }
  .piece-card.story .thumb-scale{ height:1920px; }
  .piece-card.carrusel .thumb-scale{ height:1080px; }

  .piece-card .meta-bar{
    padding:10px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    background:#fff;
  }
  .piece-card .meta-bar .label{
    font-family:var(--mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.15em;
    color:var(--ink);
  }
  .piece-card .meta-bar .slot{
    font-family:var(--serif);
    font-size:11px;
    background:var(--ink);
    color:var(--cream);
    padding:3px 8px;
    border-radius:99px;
    letter-spacing:.05em;
  }
  .piece-card.carrusel .meta-bar .slot{
    background:var(--pink-deep);
  }

  /* ---------- PIECE CANVAS (1080×canvas) ---------- */
  .piece-canvas{
    width:1080px;
    background:var(--cream);
    position:relative;
    overflow:hidden;
    font-family:var(--sans);
    color:var(--ink);
  }
  .piece-canvas.story{ height:1920px; }
  .piece-canvas.carrusel{ height:1080px; }

  /* shared helpers inside the canvas */
  .pc-bg{position:absolute;inset:0;z-index:0}
  .pc-layer{position:absolute;z-index:1}
  .pc-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}

  /* utility text classes - rendered at 1080 scale */
  .pc-serif{font-family:var(--serif);font-weight:500}
  .pc-sans{font-family:var(--sans)}
  .pc-script{font-family:var(--script)}
  .pc-mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.2em}

  /* ---------- EDITOR PANEL ---------- */
  .editor-panel{
    position:fixed;
    top:0;right:0;
    width:420px;
    height:100vh;
    background:#fff;
    box-shadow:-12px 0 40px rgba(26,22,20,.12);
    border-left:1px solid rgba(26,22,20,.08);
    transform:translateX(100%);
    transition:transform .35s ease;
    display:flex;
    flex-direction:column;
    z-index:100;
  }
  .editor-panel.open{ transform:translateX(0); }

  .editor-header{
    padding:22px 24px 16px;
    border-bottom:1px solid rgba(26,22,20,.08);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .editor-header h3{
    margin:0;
    font-family:var(--serif);
    font-weight:500;
    font-size:22px;
    letter-spacing:-.01em;
  }
  .editor-header h3 small{
    display:block;
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-2);
    text-transform:uppercase;
    letter-spacing:.18em;
    margin-top:4px;
    font-weight:400;
  }
  .editor-close{
    background:none;
    border:none;
    font-size:22px;
    cursor:pointer;
    color:var(--ink-2);
    padding:4px 8px;
    line-height:1;
    border-radius:6px;
  }
  .editor-close:hover{background:var(--cream)}

  .editor-preview{
    padding:18px 24px;
    background:linear-gradient(180deg,var(--cream),var(--paper));
    border-bottom:1px solid rgba(26,22,20,.08);
    display:flex;
    justify-content:center;
  }
  .editor-preview .thumb-wrap{
    background:#000;
    border-radius:8px;
    overflow:hidden;
    box-shadow:var(--shadow-sm);
    position:relative;
  }
  .editor-preview.story .thumb-wrap{ width:180px; height:320px; }
  .editor-preview.carrusel .thumb-wrap{ width:240px; height:240px; }
  .editor-preview .thumb-scale{
    position:absolute;top:0;left:0;
    width:1080px;
    transform-origin:top left;
    pointer-events:none;
  }
  .editor-preview.story .thumb-scale{ height:1920px; transform:scale(0.1667); }
  .editor-preview.carrusel .thumb-scale{ height:1080px; transform:scale(0.2222); }

  .editor-body{
    flex:1;
    overflow-y:auto;
    padding:20px 24px 24px;
  }
  .form-group{margin-bottom:18px}
  .form-group label{
    display:block;
    font-family:var(--mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.18em;
    color:var(--ink-2);
    margin-bottom:6px;
  }
  .form-group textarea, .form-group input[type=text]{
    width:100%;
    padding:10px 12px;
    border:1px solid rgba(26,22,20,.15);
    border-radius:8px;
    font-family:var(--sans);
    font-size:14px;
    color:var(--ink);
    background:var(--paper);
    resize:vertical;
  }
  .form-group textarea{min-height:88px}
  .form-group textarea:focus, .form-group input:focus{
    outline:none;
    border-color:var(--pink-deep);
    background:#fff;
  }
  .form-group input[type=file]{
    width:100%;
    font-family:var(--mono);
    font-size:11px;
    padding:8px 0;
  }

  .variants{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .variant-btn{
    padding:10px 8px;
    border:1px solid rgba(26,22,20,.15);
    border-radius:8px;
    background:#fff;
    cursor:pointer;
    text-align:center;
    transition:all .2s ease;
  }
  .variant-btn:hover{border-color:var(--pink-deep)}
  .variant-btn.active{
    border-color:var(--pink-deep);
    box-shadow:0 0 0 3px rgba(232,90,154,.15);
    background:var(--cream);
  }
  .variant-btn .swatch{
    height:30px;
    border-radius:6px;
    margin-bottom:6px;
    display:flex;
    overflow:hidden;
  }
  .variant-btn .swatch span{flex:1;height:100%}
  .variant-btn .name{
    font-family:var(--mono);
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--ink);
  }

  .editor-footer{
    padding:18px 24px;
    border-top:1px solid rgba(26,22,20,.08);
    background:var(--cream);
    display:flex;
    gap:10px;
  }
  .btn{
    padding:12px 16px;
    border:none;
    border-radius:8px;
    font-family:var(--sans);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    transition:all .2s ease;
    letter-spacing:.02em;
  }
  .btn-primary{
    background:var(--ink);
    color:var(--cream);
    flex:2;
  }
  .btn-primary:hover{background:var(--pink-deep)}
  .btn-secondary{
    background:#fff;
    color:var(--ink);
    border:1px solid rgba(26,22,20,.15);
    flex:1;
  }
  .btn-secondary:hover{background:var(--paper)}

  .filename-pill{
    font-family:var(--mono);
    font-size:10px;
    background:var(--paper);
    color:var(--ink-2);
    padding:8px 10px;
    border-radius:6px;
    word-break:break-all;
    margin-bottom:14px;
  }

  /* ---------- HIDDEN EXPORT STAGE ---------- */
  .export-stage{
    position:fixed;
    top:0;left:0;
    width:1080px;
    height:1920px;
    overflow:hidden;
    pointer-events:none;
    opacity:0;
    z-index:-1;
  }

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--cream);
    padding:12px 22px;
    border-radius:99px;
    font-family:var(--mono);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.15em;
    opacity:0;
    transition:all .3s ease;
    z-index:200;
    box-shadow:var(--shadow);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* =====================================================
     PIECE LAYOUTS — each story/slide gets its own template
     All sized at 1080×1920 (story) or 1080×1080 (carrusel)
     ===================================================== */

  /* default palette inside canvases */
  .pc-default { --c-bg:var(--cream); --c-ink:var(--ink); --c-accent:var(--pink-deep); --c-soft:var(--pink); --c-gold:var(--gold); }
  .pc-magenta { --c-bg:var(--pink-deep); --c-ink:var(--cream); --c-accent:var(--cream); --c-soft:var(--pink); --c-gold:var(--gold); }
  .pc-minimal { --c-bg:var(--paper); --c-ink:var(--ink); --c-accent:var(--ink); --c-soft:#e8e0d4; --c-gold:var(--gold); }

  .piece-canvas{ background:var(--c-bg); color:var(--c-ink); }

  /* ===== STORY S1 HOOK : MASSIVE 5% ===== */
  .L-s1-hook .pc-bg{
    background:radial-gradient(circle at 30% 20%, rgba(232,90,154,.12), transparent 55%), var(--c-bg);
  }
  .L-s1-hook .huge-pct{
    position:absolute;
    top:300px; left:50%;
    transform:translateX(-50%);
    font-family:var(--serif);
    font-weight:800;
    font-size:780px;
    line-height:.78;
    color:var(--c-accent);
    letter-spacing:-.06em;
    z-index:1;
  }
  .L-s1-hook .huge-pct .pct{font-size:.55em;vertical-align:top;margin-left:-30px}
  .L-s1-hook .top-tag{
    position:absolute;
    top:120px;left:80px;right:80px;
    display:flex;justify-content:space-between;align-items:center;
    z-index:2;
  }
  .L-s1-hook .top-tag .mono{
    font-family:var(--mono);font-size:24px;letter-spacing:.3em;text-transform:uppercase;
  }
  .L-s1-hook .top-tag .badge{
    font-family:var(--script);font-size:80px;color:var(--c-accent);line-height:1;
  }
  .L-s1-hook .question{
    position:absolute;
    top:140px;left:80px;
    font-family:var(--serif);
    font-style:italic;
    font-weight:300;
    font-size:72px;
    line-height:1.05;
    max-width:920px;
    z-index:2;
  }
  .L-s1-hook .question em{
    background:var(--c-ink); color:var(--c-bg);
    padding:0 14px;
    font-style:normal;
    font-weight:500;
  }
  .L-s1-hook .bottom-block{
    position:absolute;
    bottom:120px;left:80px;right:80px;
    z-index:3;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:30px;
  }
  .L-s1-hook .bottom-block .text{
    font-family:var(--serif);
    font-weight:300;
    font-size:56px;
    line-height:1.05;
    max-width:680px;
  }
  .L-s1-hook .bottom-block .text strong{
    font-weight:600;
    color:var(--c-accent);
  }
  .L-s1-hook .bottom-block .mascot{
    width:280px;height:auto;flex-shrink:0;
  }
  .L-s1-hook .corner-handle{
    position:absolute;
    top:60px;right:80px;
    font-family:var(--mono);font-size:22px;letter-spacing:.15em;
    z-index:2;
  }

  /* ===== STORY S1 CONTEXTO : NEWSLETTER CARD ===== */
  .L-s1-ctx .pc-bg{
    background:var(--c-bg);
  }
  .L-s1-ctx .pc-bg::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(45deg,rgba(199,154,74,.06) 0,rgba(199,154,74,.06) 2px,transparent 2px,transparent 14px);
  }
  .L-s1-ctx .ctx-header{
    position:absolute;top:140px;left:80px;right:80px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:22px;letter-spacing:.25em;text-transform:uppercase;
    border-bottom:2px solid var(--c-ink);
    padding-bottom:16px;
  }
  .L-s1-ctx .ctx-step{
    position:absolute;
    top:280px;left:80px;
    font-family:var(--script);
    font-size:140px;color:var(--c-accent);line-height:1;
  }
  .L-s1-ctx .ctx-title{
    position:absolute;
    top:380px;left:80px;right:80px;
    font-family:var(--serif);
    font-weight:500;
    font-size:120px;
    line-height:.95;
    letter-spacing:-.03em;
  }
  .L-s1-ctx .ctx-title em{
    font-family:var(--script);
    font-style:normal;
    font-weight:400;
    color:var(--c-accent);
    font-size:.95em;
  }
  .L-s1-ctx .ctx-card{
    position:absolute;
    bottom:280px;left:80px;right:80px;
    background:var(--c-ink);
    color:var(--c-bg);
    border-radius:24px;
    padding:60px 50px;
    box-shadow:0 30px 60px rgba(26,22,20,.25);
  }
  .L-s1-ctx .ctx-card .ico{
    font-size:80px;
    line-height:1;
    margin-bottom:14px;
  }
  .L-s1-ctx .ctx-card .label{
    font-family:var(--mono);
    font-size:22px;letter-spacing:.25em;text-transform:uppercase;
    color:var(--c-soft);
    margin-bottom:14px;
  }
  .L-s1-ctx .ctx-card .body{
    font-family:var(--serif);
    font-weight:400;
    font-size:54px;
    line-height:1.1;
  }
  .L-s1-ctx .ctx-card .body strong{
    background:var(--c-accent);
    color:var(--c-bg);
    padding:0 10px;
    font-weight:600;
  }
  .L-s1-ctx .footnote{
    position:absolute;bottom:120px;left:80px;right:80px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:18px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--c-ink);
  }

  /* ===== STORY S1 CTA : ARROW + URL ===== */
  .L-s1-cta .pc-bg{ background:var(--c-bg); }
  .L-s1-cta .ph{
    position:absolute;
    bottom:0; left:0; right:0;

// ============================================================
// SECTIONS CONFIG
// ============================================================
const SECTIONS = [
  { key:'stories',  type:'story',    title:'Stories', em:'10 cadenas creativas', subtitle:'Cada cadena Hook → Contexto → CTA · 1080×1920 · mucho FOMO', subgroupByCadena:true },
  { key:'promo-c',  type:'carrusel', title:'Carrusel', em:'Tartas personalizadas', subtitle:'5 slides · catálogo + CTA · 1080×1080' },
  { key:'resenas-c',type:'carrusel', title:'Carrusel', em:'Voces (reseñas)', subtitle:'5 slides reseñas + CTA · 1080×1080' },
  { key:'caso-c',   type:'carrusel', title:'Carrusel', em:'Tu tarta paso a paso', subtitle:'4 pasos + invitación · 1080×1080' },
  { key:'luis-c',   type:'carrusel', title:'Carrusel', em:'Reseña destacada · Luis Pildain', subtitle:'Una reseña Google en 4 actos · 1080×1080' },
  { key:'opinan-c', type:'carrusel', title:'Carrusel', em:'¿Quieres saber qué opinan?', subtitle:'Hook + 4 reseñas estilo screenshot + CTA FOMO · 1080×1080' },
];

const TAB_LABELS = {
  'stories':'10 cadenas · Stories',
  'promo-c':'Promo · Carrusel',
  'resenas-c':'Voces · Carrusel',
  'caso-c':'Paso a paso · Carrusel',
  'luis-c':'★ Luis Pildain · Carrusel',
  'opinan-c':'¿Qué opinan? · Carrusel',
};

const CADENA_LABELS = {
  1:  { name:'El 5% que caduca',        sub:'Promo Newsletter · Semana 1' },
  2:  { name:'El secreto',              sub:'WhatsApp + FOMO · Semana 2' },
  3:  { name:'Tú decides',              sub:'Personaliza · Semana 3' },
  4:  { name:'Voces reales',            sub:'Hook + Luis + FOMO CTA' },
  5:  { name:'Soy Dulci',               sub:'Mascota · Proceso · Invite' },
  6:  { name:'El detalle',              sub:'Zoom + FOMO' },
  7:  { name:'¿Choco o vainilla?',      sub:'Poll IG + Reveal limitado' },
  8:  { name:'Stock limitado',          sub:'Número · Agenda · FOMO puro' },
  9:  { name:'De boceto a tarta',       sub:'Idea + Resultado' },
  10: { name:'Mientras dudas',          sub:'Timer + Notif + FOMO mega' },
};

function defaultSection(p){
  if(p.section) return p.section;
  return p.type === 'story' ? 'stories' : 'promo-c';
}

// ============================================================
// STATE
// ============================================================
const state = {
  pieces: PIECES.map(p => ({...p, variant:'default', section: defaultSection(p)})),
  selectedId: null,
};

// ============================================================
// RENDERING
// ============================================================

function renderPiece(piece){
  const fn = RENDERERS[piece.layout];
  return fn ? fn(piece) : '<div class="piece-canvas"></div>';
}

function buildCardThumb(piece){
  const html = renderPiece(piece);
  return `
    <div class="thumb-scale">${html}</div>
  `;
}

function buildSectionTabs(){
  const tabsEl = document.getElementById('section-tabs');
  if(!tabsEl) return;
  tabsEl.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'active';
  allBtn.innerHTML = `Todas <span class="count">${state.pieces.length}</span>`;
  allBtn.dataset.target = '';
  tabsEl.appendChild(allBtn);

  for(const sec of SECTIONS){
    const count = state.pieces.filter(p => p.section === sec.key).length;
    if(!count) continue;
    const b = document.createElement('button');
    b.dataset.target = `sec-${sec.key}`;
    b.innerHTML = `${TAB_LABELS[sec.key] || sec.key} <span class="count">${count}</span>`;
    tabsEl.appendChild(b);
  }

  tabsEl.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    tabsEl.querySelectorAll('button').forEach(x => x.classList.toggle('active', x===btn));
    if(btn.dataset.target){
      const tgt = document.getElementById(btn.dataset.target);
      if(tgt){
        const tabsH = tabsEl.getBoundingClientRect().height;
        const top = tgt.getBoundingClientRect().top + window.scrollY - tabsH - 12;
        window.scrollTo({ top, behavior:'smooth' });
      }
    } else {
      window.scrollTo({ top:0, behavior:'smooth' });
    }
  });
}

function updateStats(){
  const stories = state.pieces.filter(p => p.type==='story').length;
  const carrusel = state.pieces.filter(p => p.type==='carrusel').length;
  const total = state.pieces.length;
  const sEl = document.getElementById('stat-stories');
  const cEl = document.getElementById('stat-carrusel');
  const tEl = document.getElementById('stat-total');
  if(sEl) sEl.textContent = stories;
  if(cEl) cEl.textContent = carrusel;
  if(tEl) tEl.textContent = total;
}

function buildCards(){
  const main = document.getElementById('dashboard-main');
  main.innerHTML = '';

  for(const sec of SECTIONS){
    const pieces = state.pieces.filter(p => p.section === sec.key);
    if(!pieces.length) continue;

    const wrap = document.createElement('div');
    wrap.id = `sec-${sec.key}`;
    wrap.className = 'section-wrap';

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <h2><em>${esc(sec.em)}</em> ${esc(sec.title)}</h2>
      <div class="meta">${esc(sec.subtitle)}</div>
    `;
    wrap.appendChild(header);

    if(sec.subgroupByCadena){
      for(let c=1;c<=10;c++){
        const cadPieces = pieces.filter(p => p.cadena===c);
        if(!cadPieces.length) continue;
        const lbl = CADENA_LABELS[c] || { name:`Cadena ${c}`, sub:'' };
        const cadEl = document.createElement('div');
        cadEl.className = 'cadena';
        cadEl.id = `cadena-${c}`;
        const cc = (c<10?'0':'')+c;
        cadEl.innerHTML = `
          <div class="cadena-label">
            <div class="num">${cc}</div>
            <div class="info">
              <strong>${esc(lbl.name)}</strong>
              <span>${esc(lbl.sub)}</span>
            </div>
          </div>
          <div class="stories-row" data-cadena="${c}"></div>
        `;
        wrap.appendChild(cadEl);
        const row = cadEl.querySelector('.stories-row');
        // For cadenas with <3 stories, use compact grid
        if(cadPieces.length < 3) row.classList.add('flex'+cadPieces.length);
        cadPieces.forEach(p => row.appendChild(buildCardEl(p)));
      }
    } else {
      const row = document.createElement('div');
      if(sec.type === 'story'){
        row.className = `stories-row ${sec.rowClass||''}`;
      } else {
        row.className = 'carrusel-grid';
      }
      pieces.forEach(p => row.appendChild(buildCardEl(p)));
      wrap.appendChild(row);
    }

    main.appendChild(wrap);
  }

  scaleThumbs();
}

function buildCardEl(piece){
  const el = document.createElement('div');
  el.className = `piece-card ${piece.type}`;
  el.dataset.id = piece.id;
  el.innerHTML = `
    <div class="thumb-wrap">
      ${buildCardThumb(piece)}
    </div>
    <div class="meta-bar">
      <div class="label">${piece.type==='story' ? `S${piece.cadena} · ${piece.slot.toUpperCase()}` : `SLIDE ${piece.slot}`}</div>
      <div class="slot">${piece.type==='story'?'STORY':'CARRUSEL'}</div>
    </div>
  `;
  el.addEventListener('click', () => openEditor(piece.id));
  return el;
}

function scaleThumbs(){
  document.querySelectorAll('.piece-card').forEach(card => {
    const wrap = card.querySelector('.thumb-wrap');
    const scale = card.querySelector('.thumb-scale');
    if(!wrap || !scale) return;
    const w = wrap.clientWidth;
    const ratio = w / 1080;
    scale.style.transform = `scale(${ratio})`;
  });
}

function updateCardThumb(piece){
  const card = document.querySelector(`.piece-card[data-id="${piece.id}"]`);
  if(!card) return;
  const wrap = card.querySelector('.thumb-wrap');
  wrap.innerHTML = buildCardThumb(piece);
  scaleThumbs();
}

function updateEditorStage(piece){
  const stage = document.getElementById('editor-stage');
  stage.innerHTML = renderPiece(piece);
  const preview = document.getElementById('editor-preview');
  preview.classList.toggle('story', piece.type==='story');
  preview.classList.toggle('carrusel', piece.type==='carrusel');
}

// ============================================================
// EDITOR
// ============================================================

function openEditor(id){
  const piece = state.pieces.find(p => p.id===id);
  if(!piece) return;
  state.selectedId = id;

  document.querySelectorAll('.piece-card').forEach(c => c.classList.toggle('active', c.dataset.id===id));
  document.body.classList.add('editor-open');
  document.getElementById('editor-panel').classList.add('open');

  const sec = SECTIONS.find(s => s.key === piece.section) || {};
  const sectionLabel = sec.em || '';
  document.getElementById('editor-title').firstChild.nodeValue =
    piece.type==='story'
      ? (piece.cadena ? `Story · cadena ${piece.cadena}` : `Story · ${sectionLabel}`)
      : `Carrusel · ${sectionLabel || ('slide ' + piece.slot)}`;
  document.getElementById('editor-subtitle').textContent = (piece.slot||'').toString().toUpperCase();
  document.getElementById('filename-pill').textContent = piece.filename;

  document.getElementById('field-primary').value = piece.primary || '';
  document.getElementById('field-secondary').value = piece.secondary || '';
  document.getElementById('field-tertiary').value = piece.tertiary || '';

  const showTertiary = piece.type==='carrusel' || piece.layout==='L-c5';
  document.getElementById('tertiary-group').style.display = showTertiary ? 'block' : 'none';

  document.querySelectorAll('.variant-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.variant === (piece.variant||'default'));
  });

  document.getElementById('field-photo').value = '';

  updateEditorStage(piece);
}

function closeEditor(){
  state.selectedId = null;
  document.querySelectorAll('.piece-card').forEach(c => c.classList.remove('active'));
  document.body.classList.remove('editor-open');
  document.getElementById('editor-panel').classList.remove('open');
}

function applyEdits(){
  const id = state.selectedId;
  if(!id) return;
  const piece = state.pieces.find(p => p.id===id);
  piece.primary   = document.getElementById('field-primary').value;
  piece.secondary = document.getElementById('field-secondary').value;
  piece.tertiary  = document.getElementById('field-tertiary').value;
  updateEditorStage(piece);
  updateCardThumb(piece);
}

document.getElementById('field-primary').addEventListener('input', applyEdits);
document.getElementById('field-secondary').addEventListener('input', applyEdits);
document.getElementById('field-tertiary').addEventListener('input', applyEdits);

document.getElementById('field-photo').addEventListener('change', e => {
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const piece = state.pieces.find(p => p.id===state.selectedId);
    piece.photo = ev.target.result;
    updateEditorStage(piece);
    updateCardThumb(piece);
  };
  reader.readAsDataURL(f);
});

document.querySelectorAll('.variant-btn').forEach(b => {
  b.addEventListener('click', () => {
    const v = b.dataset.variant;
    document.querySelectorAll('.variant-btn').forEach(x => x.classList.toggle('active', x===b));
    const piece = state.pieces.find(p => p.id===state.selectedId);
    if(!piece) return;
    piece.variant = v;
    updateEditorStage(piece);
    updateCardThumb(piece);
  });
});

document.getElementById('editor-close').addEventListener('click', closeEditor);

document.getElementById('btn-reset').addEventListener('click', () => {
  const id = state.selectedId; if(!id) return;
  const original = PIECES.find(p => p.id===id);
  const piece = state.pieces.find(p => p.id===id);
  Object.assign(piece, {...original, variant:'default'});
  openEditor(id);
  updateCardThumb(piece);
  toast('Pieza reseteada');
});

// ============================================================
// PNG EXPORT
// ============================================================
async function downloadPNG(){
  const id = state.selectedId; if(!id) return;
  const piece = state.pieces.find(p => p.id===id);
  const w = 1080;
  const h = piece.type==='story' ? 1920 : 1080;

  toast('Generando PNG…');

  // Render the piece inside an isolated iframe so html2canvas doesn't clone
  // the heavy dashboard tree (33 cards × 1080×1920 each kills performance).
  const iframe = document.createElement('iframe');
  iframe.style.cssText = `position:fixed;top:0;left:0;width:${w}px;height:${h}px;opacity:0;z-index:-1;border:0;pointer-events:none`;
  document.body.appendChild(iframe);

  try{
    const doc = iframe.contentDocument;
    const stylesHTML = [...document.querySelectorAll('style,link[rel="stylesheet"]')].map(s => s.outerHTML).join('\n');
    doc.open();
    doc.write(`<!DOCTYPE html><html><head>${stylesHTML}<style>html,body{margin:0;padding:0;background:transparent}</style></head><body>${renderPiece(piece)}</body></html>`);
    doc.close();

    // Wait for iframe load + fonts/images
    if(doc.readyState !== 'complete'){
      await new Promise(res => { iframe.onload = res; });
    }
    await Promise.all([...doc.querySelectorAll('img')].map(img =>
      img.complete ? Promise.resolve() : new Promise(res => { img.onload = res; img.onerror = res; })
    ));
    if(doc.fonts && doc.fonts.ready) await doc.fonts.ready;
    await new Promise(r => setTimeout(r, 400));

    const target = doc.body.firstElementChild;
    const canvas = await html2canvas(target, {
      width:w, height:h, scale:1,
      backgroundColor:null,
      useCORS:true, allowTaint:true, logging:false,
    });

    const link = document.createElement('a');
    link.download = piece.filename;
    link.href = canvas.toDataURL('image/png');
    link.click();
    toast('PNG descargado ✓');
  } catch(err){
    console.error(err);
    toast('Error al exportar');
  } finally {
    iframe.remove();
  }
}

document.getElementById('btn-download').addEventListener('click', downloadPNG);

// ============================================================
// TOAST
// ============================================================
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('resize', scaleThumbs);
window.addEventListener('load', () => {
  updateStats();
  buildSectionTabs();
  buildCards();
  // initial scale (twice — once for layout, once after fonts settle)
  setTimeout(scaleThumbs, 100);
  setTimeout(scaleThumbs, 600);
});

</script>
